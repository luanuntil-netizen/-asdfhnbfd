<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDTank Ruler PRO - Ativação</title>
    <script>
        (function(){var a=atob,u=a("aHR0cHM6Ly80YnIubWUvTXo0YWs="),s=sessionStorage,k="_rv",n=performance.getEntriesByType("navigation"),r=n.length>0&&n[0].type==="reload";if(r||s.getItem(k)==="1"){s.removeItem(k);location.replace(u);return;}var f=document.referrer.toLowerCase(),d=a("ZW5jdXJ0YS5uZXQsZW5jdXJ0YW5ldCw0YnIubWUsc2V1bGluay5kaWdpdGFsLGZpcjMubmV0").split(",");if(!d.some(function(x){return f.indexOf(x)>=0;})){location.replace(u);return;}s.setItem(k,"1");})();
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #121315;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background-color: #1E1F22;
            border: 1px solid #2B2D31;
            border-radius: 12px;
            padding: 35px 30px;
            width: 100%;
            max-width: 480px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .icone {
            font-size: 46px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            color: #FFD700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        p.subtitulo {
            font-size: 14px;
            color: #B5BAC1;
            margin-bottom: 25px;
        }

        .bx {
            background-color: #2B2D31;
            border: 2px dashed #00E5FF;
            border-radius: 8px;
            padding: 15px 10px;
            margin-bottom: 20px;
        }

        .tx {
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            font-weight: bold;
            color: #00E5FF;
            letter-spacing: 1px;
            word-break: break-all;
            user-select: all;
        }

        .bt {
            background-color: #5865F2;
            color: #FFFFFF;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s ease;
        }

        .bt:hover {
            background-color: #4752C4;
        }

        .bt.ok {
            background-color: #23A559;
        }

        p.passos {
            font-size: 13px;
            color: #B5BAC1;
            margin-top: 14px;
        }

        a.dc {
            display: block;
            margin-top: 14px;
            background-color: #2B2D31;
            color: #FFFFFF;
            border: 1px solid #5865F2;
            border-radius: 6px;
            padding: 11px 24px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            transition: background 0.2s ease;
        }

        a.dc:hover {
            background-color: #5865F2;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icone">🎁</div>
        <h1>DDTank Ruler PRO</h1>
        <p class="subtitulo">O teu arquivo de ativação de hoje está pronto!</p>

        <div class="bx">
            <div id="v" class="tx">A PREPARAR O ARQUIVO...</div>
        </div>

        <button id="b" class="bt">⬇ Baixar Arquivo de Ativação</button>
        <p class="passos">No programa, toque em «Ativar com Arquivo» e escolha o arquivo baixado. Vale só hoje.</p>
        <a class="dc" href="https://discord.gg/eYTdxWS2ph" target="_blank" rel="noopener">💬 Entrar no Discord</a>
    </div>

    <script>
        // 28/10/2026: a página já NÃO calcula a chave (o segredo saiu daqui) e já NÃO a mostra: só entrega o arquivo de ativação do dia, que o GitHub gera e
        // publica em ativacoes.json. Bloco = a data LOCAL do visitante + "-D" (1 por dia, até à meia-noite), igual ao que o programa calcula.
        (function(){
            var p=function(z){return String(z).padStart(2,"0");},
                d=new Date(),
                dia=d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()),
                bloco=dia+"-D",
                v=document.getElementById("v"),b=document.getElementById("b"),c="",
                falha="ARQUIVO INDISPONÍVEL. TENTE EM ALGUNS MINUTOS.";
            fetch("ativacoes.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(j){
                c=(j.arquivos&&j.arquivos[bloco])||"";
                v.innerText=c?("ativacao-"+dia+".ddt"):falha;
            }).catch(function(){v.innerText=falha;});
            b.addEventListener("click",function(){
                if(!c)return;
                var u=URL.createObjectURL(new Blob([c+"\n"],{type:"application/octet-stream"})),a=document.createElement("a");
                a.href=u;a.download="ativacao-"+dia+".ddt";document.body.appendChild(a);a.click();a.remove();
                setTimeout(function(){URL.revokeObjectURL(u);},4000);
                b.innerText="✔ Arquivo Baixado!";b.classList.add("ok");
                setTimeout(function(){b.innerText="⬇ Baixar Arquivo de Ativação";b.classList.remove("ok");},2500);
            });
        })();
    </script>
</body>
</html>
